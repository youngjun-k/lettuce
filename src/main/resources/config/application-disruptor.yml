app:
  disruptor:
    # Buffer size for the Disruptor ring buffer (must be power of 2)
    buffer-size: 16384
    # Number of worker threads (adjust based on available cores, but less than total cores)
    worker-threads: 4
    # Use YIELDING wait strategy for balanced performance/CPU usage
    wait-strategy: yielding
    # Ring buffer claim strategy
    claim-strategy: multi-threaded
    # Enable batch processing for better throughput
    batch-size: 100
    # Event handler exception handling
    exception-handler: "com.example.lettuce.global.infrastructure.event.CustomDisruptorExceptionHandler"

spring:
  datasource:
    hikari:
      # Increase minimum idle connections to reduce connection contention
      minimum-idle: 8
      # Maximum pool size - adjust based on your application needs
      maximum-pool-size: 16
      # Tune the connection timeout to avoid long waits
      connection-timeout: 20000
      # Enable leak detection to find potential connection leaks
      leak-detection-threshold: 30000
      # Set housekeeping period to higher value to reduce frequency
      housekeeping-period-ms: 30000
      # Enable metrics for monitoring
      metrics-registry-type: micrometer 