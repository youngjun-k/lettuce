spring:
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 2000
      client-type: lettuce
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 2
          max-wait: 1500ms
        shutdown-timeout: 200ms
  cache:
    type: redis
    redis:
      time-to-live: 3600000  # 1 hour in milliseconds
      cache-null-values: false
    cache-names:
      - user_email
      - profile
      - carbon_footprint_product_by_product_id
      - carbon_footprint_product_by_product_name
      - user_email_with_profiles