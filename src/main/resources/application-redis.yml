spring:
  # Legacy Redis properties (kept for backward compatibility)
  # These properties are technically deprecated but are kept because they're currently
  # required for Redis connections to work properly with the current dependencies
  redis:
    host: ${REDIS_HOST}
    port: ${REDIS_PORT}
    password: ${REDIS_PASSWORD:}
    database: 0
    timeout: 1000
    connect-timeout: 500
    client-type: lettuce
    lettuce:
      pool:
        max-active: 30
        max-idle: 15
        min-idle: 5
        max-wait: 1000ms
        time-between-eviction-runs: 60000
      shutdown-timeout: 100ms

  # New Redis properties format (Spring Boot 3.x)
  # Currently disabled as they cause connection issues
  # TODO: Migrate to these properties when dependencies are compatible
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 1000
      connect-timeout: 500
      client-type: lettuce
      lettuce:
        pool:
          max-active: 30
          max-idle: 15
          min-idle: 5
          max-wait: 1000ms
          time-between-eviction-runs: 60000
        shutdown-timeout: 100ms

cache:
  type: redis
  redis:
    time-to-live: 3600000 # 1 hour in milliseconds
    cache-null-values: false
    use-key-prefix: true
    key-prefix: lettuce-cache
  cache-names:
    - user_email
    - profile
    - carbon_footprint_product_by_product_id
    - carbon_footprint_product_by_product_name
    - user_email_with_profiles
  caffeine:
    spec: maximumSize=1000,expireAfterWrite=600s
