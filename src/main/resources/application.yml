spring:
  autoconfigure:
    exclude: org.springframework.ai.autoconfigure.vectorstore.weaviate.WeaviateVectorStoreAutoConfiguration
  application:
    name: lettuce
    client-base-url: ${CLIENT_BASE_URL}

  config:
    import:
      - optional:file:.env[.properties]
      - optional:classpath:application-mysql.yml
      - optional:classpath:application-redis.yml
      - optional:classpath:application-cloud.yml

  servlet:
    multipart:
      max-file-size: 10MB

  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-4-vision-preview
          max-tokens: 1000
          temperature: 0.7

  jwt:
    secret: ${JWT_SECRET}
    access-token-expire-time: 6h
    refresh-token-expire-time: 1d

  mail:
    host: ${EMAIL_HOST}
    port: ${EMAIL_PORT}
    username: ${EMAIL_USERNAME}
    password: ${EMAIL_PASSWORD}

  crawler:
    coupang:
      base-url: ${COUPANG_BASE_URL}
      base-product-url: ${COUPANG_PRODUCT_URL}
      list-url: ${COUPANG_LIST_URL}

  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false
      name: partitionUserJob
      partition:
        user:
          chunk: 1000
        thread: 10

app:
  disruptor:
    buffer-size: 16384
    worker-threads: 4
  storage:
    parquet:
      path: /tmp/parquet-data

server:
  port: 8080
  servlet:
    context-path: /api

logging:
  level:
    root: INFO
    com.example.lettuce: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.springframework.transaction: DEBUG
    org.flywaydb: DEBUG
    
# JVM configuration
# These settings are applied at runtime through the build.gradle file
# -XX:+UseZGC
# -XX:MaxGCPauseMillis=10
# -XX:+ParallelRefProcEnabled
# -XX:ConcGCThreads=2
# -XX:ZCollectionInterval=120
