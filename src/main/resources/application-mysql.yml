spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/lettuce?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${DEV_DB_DDL_AUTO:create-drop}
    properties:
      hibernate:
        format-sql: ${DEV_DB_FORMAT_SQL:true}
        show-sql: ${DEV_DB_SHOW_SQL:true}
        use-sql-comments: ${DEV_DB_USE_SQL_COMMENTS:true}
        dialect: ${DEV_DB_DIALECT:org.hibernate.dialect.MySQL8Dialect}
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
        # Entity graph configuration to avoid N+1 problems
        default_batch_fetch_size: 100

  # Flyway configuration for database migrations
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
    clean-disabled: true
    out-of-order: false
    placeholders:
      app_user: ${DB_USERNAME:root}
    schemas: ${DB_SCHEMA:lettuce}
    table: flyway_schema_history

jdbc:
  async:
    timeout: 5000
    bulk-size: 3000
