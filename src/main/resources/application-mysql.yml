spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/lettuce?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true&useServerPrepStmts=true&cachePrepStmts=true&prepStmtCacheSize=250&prepStmtCacheSqlLimit=2048}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    hikari:
      minimum-idle: 10
      maximum-pool-size: 30
      idle-timeout: 30000
      max-lifetime: 600000
      connection-timeout: 10000
      pool-name: LettuceHikariCP
      auto-commit: false
      connection-test-query: SELECT 1

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${DEV_DB_DDL_AUTO:create-drop}
    properties:
      hibernate:
        format-sql: ${DEV_DB_FORMAT_SQL:true}
        show-sql: ${DEV_DB_SHOW_SQL:true}
        use-sql-comments: ${DEV_DB_USE_SQL_COMMENTS:true}
        dialect: ${DEV_DB_DIALECT:org.hibernate.dialect.MySQL8Dialect}
        jdbc:
          batch_size: 500
          fetch_size: 200
        order_inserts: true
        order_updates: true
        # Entity graph configuration to avoid N+1 problems
        default_batch_fetch_size: 200
        # Second-level cache configuration
        cache:
          use_second_level_cache: true
          use_query_cache: true
          region.factory_class: org.hibernate.cache.jcache.JCacheRegionFactory
        generate_statistics: ${DEV_DB_STATISTICS:false}
        # Query optimizations
        query:
          in_clause_parameter_padding: true
          plan_cache_max_size: 2048
          plan_parameter_metadata_max_size: 128

  # Flyway configuration for database migrations
  flyway:
    enabled: false
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
    clean-disabled: true
    out-of-order: false
    repair-on-migrate: true
    placeholders:
      app_user: ${DB_USERNAME:root}
    schemas: ${DB_SCHEMA:lettuce}
    table: flyway_schema_history

jdbc:
  async:
    timeout: 5000
    bulk-size: 5000
