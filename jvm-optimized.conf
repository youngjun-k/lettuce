# Optimized JVM arguments for Lettuce application
# Copy these arguments to your deployment script or container configuration

# Memory settings
-Xms2G
-Xmx4G
-XX:MaxMetaspaceSize=512M
-XX:MaxDirectMemorySize=1G

# ZGC (Z Garbage Collector) for low-latency garbage collection
-XX:+UseZGC
-XX:ConcGCThreads=4
-XX:ZCollectionInterval=120
-XX:MaxGCPauseMillis=10
-XX:+ParallelRefProcEnabled

# Memory allocation tuning
-XX:+AlwaysPreTouch
-XX:+DisableExplicitGC
-XX:+UseNUMA

# Class data sharing for faster startup
-XX:+UseCompressedClassPointers
-XX:+UseCompressedOops
-XX:+UseStringDeduplication

# Thread stack size tuning
-Xss512k

# Flight Recorder for performance analysis (enable when needed)
#-XX:+FlightRecorder
#-XX:StartFlightRecording=duration=120s,filename=lettuce-recording.jfr

# Heap dumps on OutOfMemoryError
-XX:+HeapDumpOnOutOfMemoryError
-XX:HeapDumpPath=/tmp/lettuce-heapdump.hprof

# JIT compiler optimizations
-XX:+TieredCompilation
-XX:+OptimizeStringConcat
-XX:CompileThreshold=10000

# Network stack tuning
-Dsun.net.inetaddr.ttl=60
-Djava.security.egd=file:/dev/./urandom

# Application specific
-Dspring.profiles.active=prod
-Dcom.sun.management.jmxremote=true
-Dcom.sun.management.jmxremote.authenticate=false
-Dcom.sun.management.jmxremote.ssl=false
-Dcom.sun.management.jmxremote.port=1099
-Dserver.tomcat.max-threads=300 